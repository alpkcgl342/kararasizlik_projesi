<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anket Oluştur — Kararsızım</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="index.html">🎲 Kararsızım</a>
    <nav id="nav-auth"></nav>
  </header>

  <main>
    <div class="card">
      <h1>Yeni Anket</h1>
      <form id="new-poll-form">
        <div class="field">
          <label for="question">Soru</label>
          <input type="text" id="question" maxlength="280" required placeholder="Bugün sinemaya mı gitsem restorana mı?" />
        </div>

        <label>Seçenekler (en az 2, en fazla 5)</label>
        <div id="options"></div>
        <button type="button" id="add-option">+ Seçenek ekle</button>

        <div class="error" id="form-error" style="display:none; margin-top: 1rem;"></div>

        <div style="margin-top: 1rem;">
          <button type="submit">Anketi Yayınla</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/new-poll.js"></script>
</body>
</html>
