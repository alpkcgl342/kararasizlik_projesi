[project]
name = "kararsizim"
version = "0.1.0"
requires-python = ">=3.12"
# Not: Vercel build'i (uv) bağımlılıkları requirements.txt yerine buradan okuyor
# (pyproject.toml var olduğu için). İkisini senkron tut — yerel `pip install`
# requirements.txt'i kullanmaya devam ediyor.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
]

[tool.vercel]
# api/main.py, "app" değişkeni (FastAPI() örneği) — bkz. CLAUDE.md / Faz 4 notları.
entrypoint = "api.main:app"
