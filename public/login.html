<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş Yap — Kararsızım</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="index.html">Kararsızım</a>
    <nav id="nav-auth"></nav>
  </header>

  <main>
    <div class="card">
      <h1>Giriş Yap</h1>
      <form id="login-form">
        <div class="field">
          <label for="email">E-posta</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Parola</label>
          <input type="password" id="password" required />
        </div>

        <div class="error" id="form-error" style="display:none"></div>

        <button type="submit">Giriş Yap</button>
      </form>
      <p class="muted" style="margin-top: 1rem;">
        Hesabın yok mu? <a href="register.html">Kayıt ol</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("form-error");
      errorBox.style.display = "none";
      try {
        await window.api.post("/auth/login", {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        });
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
